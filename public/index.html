<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Потрачено</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
      <div class="month" id="monthLabel"></div>
      <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
      <button class="icon-btn settings-btn" id="openSettings" aria-label="Настройки">⚙︎</button>
    </header>

    <main id="main">
      <section class="hero card" id="hero"></section>
      <section id="upcomingSection"></section>
      <section id="categoriesSection"></section>
      <section id="incomeSection"></section>
      <section id="entriesSection"></section>
      <div class="spacer"></div>
    </main>

    <nav class="bottom-bar">
      <button class="btn btn-secondary" id="addIncome"><span class="pos-text">＋</span><span data-i18n="addIncome"></span></button>
      <button class="btn btn-secondary" id="addManual"><span>−</span><span data-i18n="addExpense"></span></button>
      <button class="btn btn-primary" id="addReceipt"><span>📷</span><span data-i18n="addReceipt"></span></button>
    </nav>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
