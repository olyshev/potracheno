<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Потрачено</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- заставка: монетка падает, крутится в центре, пока грузятся данные, и улетает вниз -->
  <div id="splash" aria-hidden="true">
    <div class="sp-lines"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="sp-drop"><div class="sp-bob"><div class="sp-coin">
      <b class="sp-face sp-front"></b><i style="transform:translateZ(-0.9px)"></i><i style="transform:translateZ(-1.8px)"></i><i style="transform:translateZ(-2.7px)"></i><i style="transform:translateZ(-3.6px)"></i><i style="transform:translateZ(-4.5px)"></i><i style="transform:translateZ(-5.4px)"></i><i style="transform:translateZ(-6.3px)"></i><i style="transform:translateZ(-7.2px)"></i><i style="transform:translateZ(-8.1px)"></i><b class="sp-face sp-back"></b>
    </div></div></div>
    <div class="sp-text" id="splashText">Загружаем<span class="sp-dots"><i>.</i><i>.</i><i>.</i></span></div>
  </div>
  <div id="app">
    <header class="top">
      <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
      <div class="month" id="monthLabel"></div>
      <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
      <button class="icon-btn settings-btn" id="openSettings" aria-label="Настройки">⚙︎</button>
    </header>

    <main id="main">
      <section id="storiesRow"></section>
      <section class="hero card" id="hero"></section>
      <section id="upcomingSection"></section>
      <section id="categoriesSection"></section>
      <section id="incomeSection"></section>
      <section id="entriesSection"></section>
      <div class="spacer"></div>
    </main>

    <nav class="bottom-bar">
      <button class="btn btn-secondary" id="addIncome"><span class="pos-text">＋</span><span data-i18n="addIncome"></span></button>
      <button class="btn btn-secondary" id="addManual"><span>−</span><span data-i18n="addExpense"></span></button>
      <button class="btn btn-primary" id="addReceipt"><span>📷</span><span data-i18n="addReceipt"></span></button>
    </nav>
    <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
  </div>

  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
